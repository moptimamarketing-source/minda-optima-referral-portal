<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dapatkan Kod Rujukan — Minda Optima</title>
  <meta name="theme-color" content="#0D2A5C">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/common.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-api.js"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">

  <header class="bg-brand">
    <div class="max-w-md mx-auto px-4 py-4">
      <a href="index.html" class="text-white font-extrabold text-lg tracking-tight">Minda<span class="text-gold">Optima</span></a>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-10">
    <form id="login-form" novalidate class="rounded-2xl bg-white p-6 sm:p-8 shadow-sm border border-slate-200">
      <h1 class="text-2xl font-extrabold text-brand">Dapatkan Kod Rujukan</h1>
      <p class="mt-1 text-sm text-slate-500">Masukkan nombor telefon anda. Sudah daftar? Nombor yang sama akan membawa anda ke dashboard.</p>

      <label for="phone" class="mt-6 block text-sm font-semibold text-slate-700">Nombor Telefon</label>
      <div class="mt-2 flex rounded-xl border border-slate-300 focus-within:border-brand focus-within:ring-2 focus-within:ring-brand/20">
        <span class="flex items-center pl-4 pr-2 text-slate-500 select-none">🇲🇾</span>
        <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national"
               placeholder="012-3456789" maxlength="12" required
               class="w-full rounded-r-xl bg-transparent px-2 py-3 text-lg tracking-wide outline-none">
      </div>
      <p class="mt-1 text-xs text-slate-400">Format: 01X-XXXXXXX</p>

      <div id="name-field" class="hidden mt-6">
        <label for="name" class="block text-sm font-semibold text-slate-700">Nama Penuh</label>
        <p class="text-xs text-slate-400">Nombor baru. Sila isi nama anda untuk daftar sebagai rujukan.</p>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="80" placeholder="cth. Siti Aminah"
               class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20">
      </div>

      <p id="error" class="mt-3 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert"></p>

      <button type="submit" class="mt-6 w-full rounded-xl bg-brand py-3.5 text-white font-bold hover:bg-brand-light disabled:opacity-60 transition">
        Teruskan
      </button>
    </form>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const phoneInput = document.getElementById('phone');
    const nameInput = document.getElementById('name');
    const nameField = document.getElementById('name-field');
    const errorEl = document.getElementById('error');

    function showError(message) {
      errorEl.textContent = message || '';
      errorEl.classList.toggle('hidden', !message);
    }

    phoneInput.addEventListener('input', () => {
      const d = phoneInput.value.replace(/\D/g, '').slice(0, 11);
      phoneInput.value = d.length > 3 ? `${d.slice(0, 3)}-${d.slice(3)}` : d;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showError();
      if (!/^01\d-?\d{7,8}$/.test(phoneInput.value.trim())) {
        return showError('Nombor telefon tidak sah. Contoh: 012-3456789');
      }
      const btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        const data = await MO.api('/api/login', {
          method: 'POST',
          body: { phone: phoneInput.value, name: nameInput.value },
        });
        window.location.href = data.redirect || 'dashboard.html';
      } catch (err) {
        if (err.needName) {
          nameField.classList.remove('hidden');
          nameInput.focus();
        }
        showError(err.message);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
